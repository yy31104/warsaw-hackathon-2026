# Teams, people, on-call and channel preferences. Hot-reloaded.
# Contacts are fake (example.com, 555-01xx). Delivery goes to Mailpit / fake-telecom only.
fallback_team: platform          # receives needs_review / unrouted signals in the UI

default_preferences:             # task 2.3 example: critical -> phone + SMS; warning -> email; info -> UI only
  - {min_severity: critical, channels: [phone, sms]}
  - {min_severity: error, channels: [sms]}
  - {min_severity: warning, channels: [email]}
  - {min_severity: info, channels: [ui]}

teams:
  - id: settlements
    name: Team Settlements
    members: [sam, lee]
    oncall: {primary: sam, secondary: lee}
    approvers: [lee]
  - id: pricing
    name: Team Pricing
    members: [pat]
    oncall: {primary: pat}
    approvers: [pat]
  - id: rates
    name: Team Rates
    members: [rita]
    oncall: {primary: rita}
    approvers: [rita]
  - id: counterparty-support
    name: Counterparty Support
    members: [cara]
    oncall: {primary: cara}
    approvers: [cara]
  - id: payments
    name: Payments
    members: [anna, paul]
    oncall: {primary: paul}
    approvers: [paul]            # "needs approval from the team lead" (Appendix B markdown runbook)
  - id: platform
    name: Platform (fallback owner)
    members: [ops]
    oncall: {primary: ops}
    approvers: [ops]

