<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone simulator · Alert Funnel</title>
  <style>
    :root { color-scheme: light; font: 16px/1.45 Inter, "Segoe UI", sans-serif; color: #182c31; background: #edf3f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(860px, 100%); margin: 0 auto; padding: 40px 28px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .mark { width: 36px; height: 36px; display: grid; place-items: center; background: #0c6255; color: white; border-radius: 11px; font-size: 20px; }
    h1,h2,p { margin: 0; }
    h1 { font-size: clamp(23px, 4vw, 32px); letter-spacing: -.045em; }
    h2 { font-size: 21px; letter-spacing: -.025em; }
    .workspace { display: grid; grid-template-columns: minmax(210px, .85fr) minmax(280px, 1.15fr); gap: clamp(22px, 7vw, 64px); align-items: start; }
    .controls { background: white; border: 1px solid #d0dedb; border-radius: 18px; padding: 24px; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 6px; }
    .controls label { margin-top: 22px; }
    select,input,button { font: inherit; }
    select,input { border: 1px solid #aebfba; background: white; border-radius: 8px; padding: 9px; min-width: 0; }
    select { width: 100%; }
    button { border: 0; border-radius: 8px; color: white; background: #0b6354; padding: 9px 15px; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .52; cursor: default; }
    :focus-visible { outline: 3px solid #007d74; outline-offset: 2px; }
    .phone { background: #253437; border: 2px solid #132024; padding: 9px; border-radius: 36px; box-shadow: 0 14px 30px #2339361f; }
    .screen { height: min(610px, 78vh); min-height: 420px; border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; background: #fafcfb; }
    .earpiece { background: #263537; border-radius: 6px; width: 46px; height: 5px; margin: 11px auto; flex: none; }
    .inbox-head { padding: 8px 20px 16px; border-bottom: 1px solid #dce5e2; }
    .number { font-size: 14px; color: #48635e; font-variant-numeric: tabular-nums; min-height: 20px; }
    .feed { overflow: auto; flex: 1; padding: 16px; }
    .empty { color: #536963; margin: 30px 4px; text-align: center; font-size: 14px; }
    article { border: 1px solid #d5e2df; background: #fff; padding: 12px 14px; border-radius: 12px; margin-bottom: 9px; }
    .meta { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; font-size: 12px; color: #526963; }
    .channel { font-weight: 700; color: #075e50; }
    .body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
    form { padding: 12px 16px; background: white; border-top: 1px solid #dce5e2; }
    .compose { display: flex; gap: 6px; }
    .compose input { width: 100%; }
    .feedback { font-size: 13px; color: #315e51; margin-top: 7px; }
    .feedback:empty { display: none; }
    .error { color: #96391f; }
    @media (max-width: 620px) {
      main { padding: 18px 14px; max-width: 440px; }
      header { margin-bottom: 14px; }
      .workspace { grid-template-columns: 1fr; gap: 16px; }
      .controls { padding: 14px 16px; }
      .controls label { margin-top: 10px; }
      .screen { height: 62vh; min-height: 360px; }
    }
  </style>
</head>
<body>
<main>
  <header><span class="mark" aria-hidden="true">☎</span><h1>Phone simulator</h1></header>
  <div class="workspace">
    <section class="controls" aria-label="Gateway controls">
      <h2>Gateway</h2>
      <label for="mode">Delivery mode</label>
      <select id="mode">
        <option value="ok">Online</option><option value="down">Down</option>
        <option value="503">HTTP 503 · retry later</option><option value="slow">Slow response</option>
        <option value="drop_response">Drop response</option>
      </select>
      <label for="number">Phone number</label>
      <select id="number"><option value="">No phones yet</option></select>
      <p id="connection" class="feedback error" role="status"></p>
    </section>
    <section class="phone" aria-label="Simulated phone">
      <div class="screen">
        <div class="earpiece" aria-hidden="true"></div>
        <div class="inbox-head"><h2>Inbox</h2><p id="address" class="number"></p></div>
        <div id="feed" class="feed"><p class="empty">Waiting for a notification.</p></div>
        <form id="reply">
          <label for="body">Reply by SMS</label>
          <div class="compose">
            <input id="body" placeholder="YES 1234" maxlength="64" required disabled autocomplete="off">
            <button id="send" disabled>Send</button>
          </div>
          <p id="feedback" class="feedback" role="status"></p>
        </form>
      </div>
    </section>
  </div>
</main>
<script>
  const byId = id => document.getElementById(id);
  const phone = byId("number"), mode = byId("mode"), body = byId("body");
  const feedback = byId("feedback"), connection = byId("connection");
  const dateFormat = new Intl.DateTimeFormat(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
  let selected = new URLSearchParams(location.search).get("to") || "";
  let sending = false, switching = false, lastFeed;

  async function request(path, payload) {
    const options = payload === undefined ? {cache:"no-store"} : {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    };
    const response = await fetch(path, options);
    const data = await response.json();
    if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed (" + response.status + ")");
    return data;
  }
  function element(type, cls, text) {
    const node = document.createElement(type);
    node.className = cls;
    node.textContent = text;
    return node;
  }
  function updateComposer() {
    body.disabled = !selected || sending;
    byId("send").disabled = !selected || sending;
    phone.disabled = !phone.value || sending;
  }
  function showMessages(items) {
    const snapshot = JSON.stringify([selected, items]);
    if (snapshot === lastFeed) return;
    lastFeed = snapshot;
    byId("address").textContent = selected;
    const feed = byId("feed");
    feed.replaceChildren();
    if (!items.length) feed.append(element("p", "empty", "Waiting for a notification."));
    for (const receipt of items) {
      const card = document.createElement("article");
      const meta = element("div", "meta", "");
      const received = new Date(receipt.received_at);
      const time = element("time", "", dateFormat.format(received));
      time.dateTime = received.toISOString();
      time.title = "Received " + received.toISOString();
      if (receipt.gen_sent_at !== null) {
        const sent = new Date(receipt.gen_sent_at);
        if (Number.isFinite(sent.getTime())) time.title += " · Sent " + sent.toISOString();
      }
      meta.append(element("span", "channel", receipt.channel === "sms" ? "SMS" : "Incoming call"), time);
      card.append(meta, element("p", "body", receipt.text));
      feed.append(card);
    }
  }
  async function refresh() {
    try {
      const [numbers, state] = await Promise.all([request("/numbers"), request("/mode")]);
      if (!switching) mode.value = state.mode;
      if (!numbers.items.includes(selected)) selected = numbers.items[0] || "";
      if (JSON.stringify(numbers.items) !== phone.dataset.numbers) {
        phone.replaceChildren(...numbers.items.map(n => new Option(n, n)));
        if (!numbers.items.length) phone.add(new Option("No phones yet", ""));
        phone.dataset.numbers = JSON.stringify(numbers.items);
      }
      phone.value = selected;
      updateComposer();
      const number = selected;
      const items = number ? (await request("/messages?" + new URLSearchParams({to:number, limit:50}))).items : [];
      if (selected === number) showMessages(items);
      connection.textContent = "";
    } catch (err) { connection.textContent = err.message; }
  }
  phone.addEventListener("change", () => {
    selected = phone.value;
    history.replaceState(null, "", "?" + new URLSearchParams({to:selected}));
    body.value = ""; feedback.textContent = "";
    refresh();
  });
  mode.addEventListener("change", async () => {
    switching = mode.disabled = true;
    let failure = "";
    try { await request("/mode", {mode:mode.value}); }
    catch (err) { failure = err.message; }
    finally {
      switching = mode.disabled = false;
      await refresh();
      if (failure) connection.textContent = failure;
    }
  });
  byId("reply").addEventListener("submit", async event => {
    event.preventDefault();
    if (sending || !selected || !body.value.trim()) return;
    sending = true; updateComposer(); feedback.classList.remove("error");
    feedback.textContent = "Sending…";
    try {
      await request("/reply", {from:selected, body:body.value.trim()});
      body.value = ""; feedback.textContent = "Reply sent.";
    } catch (err) { feedback.classList.add("error"); feedback.textContent = err.message; }
    finally { sending = false; updateComposer(); }
  });
  async function poll() { await refresh(); setTimeout(poll, 2000); }
  poll();
</script>
</body>
</html>
