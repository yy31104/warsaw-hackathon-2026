[project]
name = "alerting"
version = "0.1.0"
description = "Alert Funnel — GS Warsaw Hackathon 2026"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "aio-pika>=9.4",
  "httpx>=0.27",
  "watchfiles>=0.22",
  "anthropic",
  "openai>=3.57.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alerting"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "../tools/llm_eval"]
pythonpath = [".", ".."]
